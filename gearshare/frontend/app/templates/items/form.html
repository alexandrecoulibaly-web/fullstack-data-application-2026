{% extends "base.html" %}

{% block title %}Proposer un objet — GearShare{% endblock %}

{% block content %}
<h1>Proposer un objet</h1>

{% if erreurs %}
<ul class="alerte alerte-erreur">
  {% for erreur in erreurs %}
  <li>{{ erreur }}</li>
  {% endfor %}
</ul>
{% endif %}

{% set saisie = saisie or {} %}
<form method="post" action="/items">
  <label for="titre">Titre</label>
  <input
    type="text"
    id="titre"
    name="titre"
    value="{{ saisie.get('titre', '') }}"
    required
    minlength="3"
  >

  <label for="description">Description</label>
  <textarea id="description" name="description">{{ saisie.get('description', '') }}</textarea>

  <label for="tarif_jour">Tarif par jour</label>
  <input
    type="number"
    id="tarif_jour"
    name="tarif_jour"
    value="{{ saisie.get('tarif_jour', '') }}"
    required
    min="0.01"
    step="0.01"
  >

  <label>
    <input
      type="checkbox"
      name="disponible"
      {% if saisie.get('disponible', False) %}checked{% endif %}
    >
    Disponible
  </label>

  <button type="submit">Créer l’objet</button>
</form>
{% endblock %}
